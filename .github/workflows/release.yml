name: Release images

# Build and push multi-arch container images to GHCR. Runs on a version tag
# (v1.2.3) and on pushes to main (tagged :main and :latest). The Proxmox host
# pulls these; it never builds.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: .
            dockerfile: docker/Dockerfile
          - name: ebook-sidecar
            context: docker/ebook-sidecar
            dockerfile: docker/ebook-sidecar/Dockerfile
          - name: audiobook-sidecar
            context: docker/audiobook-sidecar
            dockerfile: docker/audiobook-sidecar/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are nested under the repo namespace: ghcr.io/<owner>/<repo>/server
      # and .../ebook-sidecar. GHCR requires a lowercase path, so normalize it.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the binary with the version (no-op for the sidecar Dockerfile,
          # which has no VERSION arg). Uses the tag name, or the short SHA on main.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a version tag, cut a GitHub Release once the images are pushed.
  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --notes "Container images for this release:
          - \`ghcr.io/$repo/server:$tag\`
          - \`ghcr.io/$repo/sidecar:$tag\`

          Deploy: see [docs/DEPLOY.md](docs/DEPLOY.md)."
