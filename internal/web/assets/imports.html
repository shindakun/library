{{define "imports.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import &middot; Library</title>
<link rel="stylesheet" href="/static/css/app.css">
<script>
  // Pre-paint theme apply (inline so there is no flash before app.js loads).
  (function () {
    // Apply a saved theme name before paint to avoid a flash; no saved value
    // means follow the OS (handled by :root + the prefers-color-scheme block).
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
<script src="/static/js/app.js" defer></script>
<script src="/static/js/imports.js" defer></script>
</head>
<body>
<header>
  <a class="back-link" href="/">Library</a>
  <h1 class="page-title">Import</h1>
  <form id="upload-form" class="upload" method="post" action="/api/upload" enctype="multipart/form-data">
    <input type="file" name="file" accept=".acsm,.epub,.cbz,.cbr" required>
    <button type="submit">Import</button>
  </form>
  <button id="theme-btn" class="theme-toggle" type="button" title="Theme" aria-label="Theme">&#127769;</button>
</header>

<div class="imports-wrap">
  <p class="hint">Upload a <code>.acsm</code>, <code>.epub</code>, <code>.cbz</code>, or <code>.cbr</code> above,
  or drop files into <code>data/import/</code>. Progress appears below as each file is
  fulfilled, decrypted, and indexed.</p>
  <ul id="job-list" class="job-list"></ul>
  <p id="job-empty" class="empty">No imports yet.</p>
</div>
</body>
</html>{{end}}
