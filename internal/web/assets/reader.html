{{define "reader.html"}}<!doctype html>
<html lang="en" class="reader">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Book.Title}}</title>
<link rel="stylesheet" href="/static/css/app.css">
<script>
  // Pre-paint theme apply (inline so there is no flash before app.js loads).
  (function () {
    // Apply a saved theme name before paint to avoid a flash; no saved value
    // means follow the OS (handled by :root + the prefers-color-scheme block).
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
  window.BOOK_SLUG = "{{.Book.Slug}}";
  // Saved EPUB CFI to resume at (empty = start). html/template JS-escapes it.
  window.START_CFI = "{{.StartCFI}}";
</script>
<script src="/static/js/app.js" defer></script>
</head>
<body class="reader">
<div id="bar">
  <a href="/">&larr; Library</a>
  <strong>{{.Book.Title}}</strong>
  <span style="margin-left:auto"></span>
  <button onclick="readerPrev()">Prev</button>
  <button onclick="readerNext()">Next</button>
  <button id="theme-btn" type="button" title="Theme" aria-label="Theme">🌙</button>
</div>
<div id="viewer"></div>

<!-- epub.js + jszip are vendored under /static/vendor (embedded in the binary). -->
<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<script src="/static/js/reader.js"></script>
</body>
</html>{{end}}
